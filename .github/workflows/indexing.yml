name: Google Indexing API Auto Push

on:
  push:
    branches:
      - main

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google APIs Client
        run: npm install googleapis

      - name: Execute Indexing Request
        run: node indexer.js
